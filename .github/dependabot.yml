version: 2
updates:
  # Cargo.lock (and Cargo.toml for new major versions), one grouped PR a month for minor and patch updates.
  - package-ecosystem: cargo
    directory: /
    schedule:
      interval: monthly
    # Major versions stay out of the group, each in its own PR, so that one
    # breaking update can't hold back the routine ones.
    groups:
      cargo:
        patterns: ["*"]
        update-types: ["minor", "patch"]

  # Keeps the action versions in .github/workflows current.
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: monthly
    groups:
      actions:
        patterns: ["*"]

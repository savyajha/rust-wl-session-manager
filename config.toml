targets = [ "NON_EXISTENT", "XDG_SESSION_ID", "XDG_RUNTIME_DIR", "XDG_SEAT", "XDG_VTNR", "DBUS_SESSION_BUS_ADDRESS", "PATH" ]
compositor_service = "niri.service"
compositor_shutdown = "niri-shutdown.target"

# Compositor crash-loop / flap detection. The compositor is restarted on any
# exit (clean or crash), so a normal quit or a one-off crash just respawns it
# and the session continues — only a stop of graphical-session.target ends the
# session. The one automatic exception is a hard crash-loop: more than
# `start_limit_burst` restarts within `start_limit_interval_sec` seconds drive
# the compositor unit into the failed state, whose OnFailure= handler starts
# `compositor_shutdown` (which Conflicts= graphical-session.target, stopping it)
# rather than leaving a session with no compositor. session-manager writes these
# into the runtime drop-in's StartLimitIntervalSec / StartLimitBurst. Both keys
# are optional; the defaults below are applied when omitted.
start_limit_interval_sec = 30
start_limit_burst = 5

[package]
name = "session-manager"
version = "0.1.0"
edition = "2024"

[dependencies]
serde = { version = "1.0", features = ["derive"] }
toml = "0.8"
tokio = { version = "1.0", features = ["full"] }
zbus = { version = "4.0", features = ["tokio"] }
futures-util = { version = "0.3", default-features = false, features = ["std", "async-await"] }

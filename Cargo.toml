[package]
name = "rust-wl-session-manager"
version = "0.1.0"
edition = "2024"

[dependencies]
anyhow = "1"
serde = { version = "1", features = ["derive"] }
toml = "1"
tokio = { version = "1", features = ["rt", "macros", "signal"] }
zbus = { version = "5", default-features = false, features = ["tokio"] }
futures-lite = "2"
tracing = "0.1"
tracing-journald = "0.3"
tracing-subscriber = "0.3"
